# ONNX Export Configuration

opset_version: 18

backbone:
  input_names: [image]
  output_names: [features, lengths]
  dynamic_shapes:
    image:
      0: {name: batch, min: 1, max: 64}
      3: {name: width, min: 32, max: 640}

prediction_net:
  input_names: [token, hidden_in]
  output_names: [output, hidden_out]
  # Fixed shapes for single-step inference

joint_net:
  input_names: [enc_frame, pred_out]
  output_names: [logits]
  # Fixed shapes for single-frame inference

lid:
  input_names: [image]
  output_names: [logits]
  dynamic_shapes:
    image:
      0: {name: batch, min: 1, max: 64}
      3: {name: width, min: 32, max: 640}

adapter:
  format: onnx_adapter   # .onnx_adapter via Olive
  dtype: float16
  tool: olive-ai

output_dir: models/
