# Lipi Vision Encoder (Backbone) Configuration
# ~12.5M parameters

stem:
  in_channels: 3
  out_channels: 64

stage1:
  dim: 192
  num_heads: 6
  head_dim: 32
  blocks: 3
  window_h: 4
  window_w: 4
  mlp_ratio: 3
  position_encoding: rope_2d
  lora_during_phase2: frozen

stage2:
  dim: 384
  num_heads: 12
  head_dim: 32
  blocks: 4
  window_h: 4
  window_w: 8
  mlp_ratio: 3
  position_encoding: rope_2d
  lora_during_phase2: active

stage3:
  dim: 384
  num_heads: 12
  head_dim: 32
  blocks: 3
  mlp_ratio: 4
  position_encoding: rope_1d
  lora_during_phase2: active

height_pooling:
  pool1:
    channels: 192
    h_in: 8
    h_out: 4
  pool2:
    channels: 384
    h_in: 4
    h_out: 1

output_dim: 384

input:
  height: 32
  max_width: 320
  channels: 3
  normalization: "[-1, 1]"
