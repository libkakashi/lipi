# lipi-r1-300M-45A — Lipi Recognition Model v1
# 300M total params, 45M active per request
# Hierarchical MoE: 6 group experts, 17 script-specific CTC heads

color_projection:
  type: learned
  hidden: 32  # 3→32→16→1, ~673 params

stem:
  type: resnet
  in_channels: 1  # from color projection
  out_channels: 64

lid_coarse:
  in_channels: 64
  num_groups: 6
  # ~6.4K params, MLP: 64→64→32→6

stage1:
  dim: 288
  num_heads: 9
  head_dim: 32
  blocks: 8
  window_h: 4
  window_w: 4
  mlp_ratio: 4
  moe: true
  num_experts: 6  # one per group
  # ~35M params (6 expert MLPs per block)

height_pool_1: 8 -> 4

lid_fine:
  in_dim: 288
  num_scripts: 17
  # ~29K params, MLP: 288→288→144→17

stage2:
  dim: 576
  num_heads: 18
  head_dim: 32
  blocks: 12
  window_h: 4
  window_w: 16
  mlp_ratio: 4
  moe: true
  num_experts: 6  # group-level (not per-script)
  # ~207M params

height_pool_2: 4 -> 1

ctc_heads:
  type: bilstm
  hidden_dim: 256
  num_layers: 2
  dropout: 0.1
  num_scripts: 17
  # ~57M total, ~3.4M per script

training:
  loss_weights:
    ctc: 1.0
    lid_coarse: 0.1
    lid_fine: 0.1

deployment:
  total_params: 300M
  active_params: 45M  # per request
  fp16_size: 600 MB
  nvfp4_size: 150 MB
  active_fp16: 90 MB
  active_nvfp4: 23 MB
