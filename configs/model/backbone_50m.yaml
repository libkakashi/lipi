# Lipi Vision Encoder — 50M variant
# ~48.7M parameters, ~24 MB at NVFP4
# For higher accuracy ceiling, quantization-resilient

stem:
  in_channels: 3
  out_channels: 64

stage1:
  dim: 320
  num_heads: 10
  head_dim: 32
  blocks: 4
  window_h: 4
  window_w: 4
  mlp_ratio: 3

stage2:
  dim: 640
  num_heads: 20
  head_dim: 32
  blocks: 6
  window_h: 4
  window_w: 8
  mlp_ratio: 3

stage3:
  dim: 640
  num_heads: 20
  head_dim: 32
  blocks: 4
  mlp_ratio: 4

output_dim: 640
