# Lipi Vision Encoder — 56M Production Model
# Deep architecture: 8/12 blocks, no stage 3 (BiLSTM handles sequence context)
# All SWA: no global attention
# MLP ratio 4 for maximum per-block capacity
# 56.5M params → 28 MB at NVFP4

stem:
  type: resnet  # heavy stem with residual blocks
  in_channels: 3
  out_channels: 64

stage1:
  # "What character is this?" — tight window, 8 refinement passes
  dim: 288
  num_heads: 9
  head_dim: 32
  blocks: 8
  window_h: 4
  window_w: 4
  mlp_ratio: 4

stage2:
  # "What fits here given neighbors?" — wide window, 12 refinement passes
  dim: 576
  num_heads: 18
  head_dim: 32
  blocks: 12
  window_h: 4
  window_w: 16
  mlp_ratio: 4

stage3:
  # No stage 3 — BiLSTM CTC head provides full word context
  blocks: 0

output_dim: 576

head:
  type: bilstm_ctc
  hidden_dim: 128
  # ~430K params, bidirectional, full word context

deployment:
  params: 56.5M (encoder) + 430K (head) = 56.9M total
  fp16_size: 113 MB
  nvfp4_size: 28 MB
