# Phase 3: Quantization-Aware Training
# Quantize backbone to NVFP4, keep GRU at FP8, fine-tune to recover accuracy
# ~1 day on 1x A100

quantization:
  # Default: NVFP4 for everything
  default:
    weight: nvfp4
    activation: nvfp4

  # GRU stays at FP8 — gating mechanisms too coarse at 4-bit
  overrides:
    prediction_net.gru:
      weight: fp8_e4m3
      activation: fp8_e4m3
    prediction_net.embedding:
      weight: fp8_e4m3

  # PolarQuant rotation for Transformer weights only (not GRU)
  polar_quant:
    apply_to: [stage1, stage2, stage3]
    targets: [qkv, mlp]

training:
  optimizer: AdamW
  lr: 1.0e-5
  weight_decay: 0.01
  epochs: 5
  batch_size: 256
  precision: bf16
  grad_clip: 1.0

# Hardware fallback
# On non-Blackwell GPUs (Ampere, Hopper): FP8 for full model
# NVFP4 requires compute capability 10.0+
hardware:
  blackwell:
    backbone: nvfp4
    gru: fp8_e4m3
  hopper_ampere:
    backbone: fp8_e4m3
    gru: fp8_e4m3

checkpoint:
  save_dir: checkpoints/phase3
