# Phase 2: LoRA Adapter Training (per language)
# Freeze backbone, train LoRA + RNN-T head
# ~1-2 days per language on 1x A100

backbone:
  checkpoint: checkpoints/phase1/phase1_best.pt
  frozen: true

lora:
  rank: 16
  alpha: 32
  target_stages: [2, 3]  # Stage 1 stays frozen
  dropout: 0.05

rnnt_head:
  vocab_size: 401        # ~250 chars + ~150 bigrams + blank
  pred_embed_dim: 128
  pred_hidden_dim: 128
  joint_dim: 256

training:
  optimizer: AdamW
  # NOTE: Do NOT add frozen backbone params to optimizer.
  # Only pass trainable params to avoid wasting memory on optimizer state.
  lora_lr: 1.0e-3
  head_lr: 1.0e-3
  weight_decay: 0.01
  epochs: 15
  batch_size: 512
  precision: bf16
  scheduler: onecycle
  warmup_pct: 0.1
  grad_clip: 1.0

distillation:
  teacher: Qwen/Qwen3-VL-8B
  alpha: 0.5             # 0.5 hard loss + 0.5 soft loss
  confidence_gate: 0.9   # Only use soft targets when teacher > 0.9
  apply_to: real_scans_only

data:
  # Per-language mix:
  # 5-8M language-specific PDF crops (perfect labels)
  # 3-5M English PDF crops (maintain bilingual)
  # 2M trdg/SynthTiger for font diversity
  # 50-100K real scans labeled by Qwen3-VL
  language_crops: training_data/datasets/{lang}_pdf_crops
  english_crops: training_data/datasets/english_pdf_crops
  synth_crops: training_data/datasets/{lang}_synth
  real_scans: training_data/datasets/{lang}_vlm_scans

checkpoint:
  save_dir: checkpoints/phase2/{lang}
  save_every_epoch: true

logging:
  wandb_project: lipi-adapters
  log_interval: 100
