# Phase 1: Pan-Indic Foundation Training
# Train backbone with temporary CTC head on multi-script data
# ~5-7 days on 2x A100

data:
  pdf_extracted: training_data/datasets/pdf_crops_degraded
  general_synth: training_data/datasets/trdg_synth
  real_data: training_data/datasets/real_mixed
  vlm_labeled: training_data/datasets/vlm_scans
  # Mix ratio: ~50% PDF, ~25% synth, ~15% real, ~10% VLM

training:
  optimizer: AdamW
  lr: 7.0e-4
  weight_decay: 0.01
  epochs: 20
  batch_size: 512
  precision: bf16
  scheduler: onecycle
  warmup_pct: 0.1
  swa_start_pct: 0.75
  grad_clip: 1.0

augmentation:
  type: randaugment_plus
  n_ops: 2
  p: 0.5

head:
  type: ctc
  charset: unicode_latin_devanagari_tamil  # ~300 chars
  note: "This head is DISCARDED after Phase 1"

checkpoint:
  save_dir: checkpoints/phase1
  save_every_epoch: true
  keep_last_n: 3

logging:
  wandb_project: lipi-foundation
  log_interval: 100
